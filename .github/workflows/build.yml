name: Android Build - Hisab Kitab Khata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        run: |
          PROJECT_FILE=$(find . -maxdepth 5 -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -maxdepth 5 -name settings.gradle -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Install Gradle 8.7
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease

      - name: Build Release AAB
        run: |
          cd "$PROJECT_DIR"
          gradle bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Kitab-Khata
          path: |
            */app/build/outputs/apk//.apk
            */app/build/outputs/bundle//.aab
          if-no-files-found: error
          retention-days: 14
